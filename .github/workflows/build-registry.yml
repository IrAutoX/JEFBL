name: Build Plugin Registry

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/plugin.json'
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate plugins.json
        run: |
          echo "[" > plugins.json
          first=true
          for dir in plugins/*/; do
            if [ -f "$dir/plugin.json" ]; then
              if [ "$first" = false ]; then echo "," >> plugins.json; fi
              cat "$dir/plugin.json" >> plugins.json
              first=false
            fi
          done
          echo "]" >> plugins.json

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update plugin registry [skip ci]"
          git push
